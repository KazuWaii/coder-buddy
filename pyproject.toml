[project]
name = "coder-buddy"
version = "0.1.0"
description = "Multi-agent coding assistant (Planner -> Architect -> Coder) built with LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=1.7.0",
    "langgraph>=1.2.12",
    "ollama>=0.6.2",
    "pydantic>=2.9.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
